<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📱 Open on Phone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0d1b3e, #0f3460, #1a1a4e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    color: white;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(165,192,240,0.3);
    border-radius: 24px;
    padding: 40px 36px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .emoji { font-size: 52px; margin-bottom: 12px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #ffd166; }
  p { font-size: 14px; color: #a5c0f0; margin-bottom: 24px; line-height: 1.6; }
  .qr-wrap {
    background: white;
    border-radius: 16px;
    padding: 16px;
    display: inline-block;
    margin-bottom: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .qr-wrap img { display: block; width: 200px; height: 200px; border-radius: 8px; }
  .link-box {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(165,192,240,0.4);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
    margin-bottom: 16px;
    word-break: break-all;
  }
  .steps { text-align: left; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px 20px; margin-top: 8px; }
  .steps p { margin-bottom: 8px; font-size: 13px; color: #c6d9ff; }
  .steps p:last-child { margin-bottom: 0; }
  .dot { display: inline-block; width: 22px; height: 22px; background: #ffd166; color: #0d1b3e; border-radius: 50%; font-weight: 800; font-size: 12px; text-align: center; line-height: 22px; margin-right: 8px; flex-shrink: 0; }
  .step-row { display: flex; align-items: flex-start; gap: 4px; margin-bottom: 8px; }
  .step-row:last-child { margin-bottom: 0; }
  .wifi-badge {
    display: inline-block;
    background: rgba(255,209,102,0.15);
    border: 1px solid #ffd166;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    color: #ffd166;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="emoji">🎂</div>
  <h1>Open Birthday Site on Phone</h1>
  <p>Scan the QR code below with your phone camera<br>or type the link in your browser</p>

  <div class="qr-wrap">
    <img id="qr" src="" alt="QR Code">
  </div>

  <div class="link-box" id="linkText">Loading...</div>

  <div class="steps">
    <div class="step-row">
      <span class="dot">1</span>
      <p>Connect phone to same <strong>Wi-Fi</strong> as this PC</p>
    </div>
    <div class="step-row">
      <span class="dot">2</span>
      <p>Open phone camera and <strong>scan QR code</strong> above</p>
    </div>
    <div class="step-row">
      <span class="dot">3</span>
      <p>Tap the link that appears — <strong>enjoy! 🎉</strong></p>
    </div>
  </div>

  <div class="wifi-badge">📶 Same Wi-Fi required</div>
</div>

<script>
  // Get local IP from server-injected value or use fallback
  const ip = "192.168.1.4";
  const port = "3000";
  const url = `http://${ip}:${port}`;

  document.getElementById("linkText").textContent = url;

  // Generate QR using free public API
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}&bgcolor=ffffff&color=0d1b3e&margin=4`;
  document.getElementById("qr").src = qrUrl;
</script>
</body>
</html>
